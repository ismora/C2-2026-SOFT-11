<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asociar certificación al empleado</title>
</head>
<body>
    <h1>Asociar certificación</h1>

    <form>
        <div>
            <label for="sltEmpleado">Empleado:</label>
            <select id="sltEmpleado"></select>
        </div>

        <div>
            <label for="sltCertificacion">Certificación:</label>
            <select id="sltCertificacion"></select>
        </div>

        <button type="button" id="btnAsociarCertificacionEmpleado">Asociar certificación al empleado</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/asociar-certificacion-empleado.js"></script>
    
</body>
</html>
