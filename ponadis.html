<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICID</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Estilos propios-->
    <link rel="stylesheet" href="css/ponadis.css">
    <!-- TODO: Sobreescribir el estilo de la clase border -->
    
</head>

<body>
    <!-- TOBAR (barra superior) -->
    <div class="container-fluid topbar"> 
        <div class="row d-flex align-items-center h-100"> <!-- Fila 1 -->
            <!--h-100: Hace que el row use toda la altura del topbar -->
            <div class="col-3 text-start" > <!-- Columna 1 -->
                <a href="" class="text-decoration-none text-white logo"> <span>Sicid <small> intranet </small></span>
                </a>

            </div>

            <div class="col-6"> <!-- Columna 2: Usuario / rol-->
                <p class="mb-0">
                    <!--mb-0: en el <p>  elimina el margen inferior que por defecto tienen los p-->
                    
                    <strong>PONADIS</strong> - <span class="visually-hidden">Rol:</span> Administrador
                </p>

                <!-- Tarea moral 1: Dar el efecto visual del diseño al <p> del tipo de usuario -->
                <!-- Tarea moral 2: Investigar propiedades de Bootstrap para dar el efecto visual al tipo de usuario -->

            </div>
            <div class="col-3 text-end"> <!-- Columna 3: Otras opciones -->
                <div class="row d-flex align-items-center justify-content-around">
                    <div class="col-3 d-flex align-items-center justify-content-end"> <!-- Opciones: - A + -->
                        <button class="btn " aria-label="Disminuir el tamaño de la fuente">
                            <i class="fa-solid fa-minus border rounded-1 p-2" aria-hidden="true"></i>                      
                        </button>

                        <!-- Ejercicio: Hacer accesibles los botones de cambiar la fuente y aumentar el tamaño de fuente -->
                        <button class="btn" aria-label="Cambiar la fuente">
                            <i class="fa-solid fa-a border rounded-1 p-2 cambio-fuente" aria-hidden="true"></i>
                            <!-- TODO: Efecto de los botones -->
                        </button>

                        <button class="btn" aria-label="Aumentar el tamaño de la fuente">
                            <i class="fa-solid fa-plus border rounded-1 p-2" aria-hidden="true"></i>
                        </button>
                    </div>

                    <div class="col-1"> <!-- Paleta de colores -->
                        <!-- Ejercicio: Completar las columnas para notificaciones y paleta de colores -->
                         <button class="btn" aria-label="Cambiar el contraste / paleta de colores">
                            <i class="fa-solid fa-circle-half-stroke border rounded-1 p-2" aria-hidden="true"></i>
                        </button>

                    </div>
                    <div class="col-1"> <!-- Notificaciones -->
                        <button class="btn" aria-label="Ver notificaciones">
                            <i class="fa-solid fa-bell" aria-hidden="true"></i>
                        </button>
                    </div>
                    <!-- Ejercicio: Cambiar la columna MC por las opciones Registrar usuario / iniciar sesión -->
                    <div class="col-2 ms-1"> 
                        <a href="" class="text-decoration-none text-white mb-0 btn">Iniciar sesión</a>
                        
                    </div>
                    <div class="col-2"> 
                        <a href="crear-cuenta.html" class="text-decoration-none text-white mb-0 p-1 btn btn-outline-secondary">Crear cuenta</a>
                        
                    </div>

                    <!-- Ejercicio: Crear un formulario para registrar usuario y un formulario para iniciar sesión -->
                </div>

            </div>
        </div>
    </div> 

    <div> <!-- Fila 2 -->

    </div> 


</body>

</html>
